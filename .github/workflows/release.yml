name: Publish verified Chinese patch
on:
  push:
    branches: [main]
    paths: ['VERSION', 'patches/**', 'apply_patch.py', 'RELEASE_NOTES.md', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_release.py
      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; leaving it unchanged."
          else
            gh release create v1.0.0 dist/* --target "$GITHUB_SHA" --title "死亡空间 中文显示补丁 v1.0.0" --notes-file RELEASE_NOTES.md
          fi
